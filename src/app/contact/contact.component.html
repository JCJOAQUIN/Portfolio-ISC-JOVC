<div class="w-full h-full">
    <app-subtitle></app-subtitle>
</div>

<section id="contact" class="py-20 sm:py-32 md:py-24">
    <div class="max-w-lg m-auto text-Primary-DarkSoft font-semibold">
        <h2 class="text-3xl lg:text-4xl mb-4">{{titleContac}}</h2>
        <div class="w-1/4 sm:w-1/12 border-4 border-Primary-DarkSoft mb-2"></div>
    </div>

    <form id="contactForm" class="m-auto max-w-md pt-10 space-y-12" action="" method="post">
        <div class="relative z-0 w-full mb-5 group col-span-1">
            <input type="text" name="floating_name" id="floating_name" class="block font-semibold py-2.5 px-4 w-full text-sm text-Information bg-transparent border-1 border-Information rounded-md appearance-none focus:outline-none focus:ring-2 focus:ring-secondary peer" placeholder=" " required />
            <label for="floating_name" class="mx-4 peer-focus:mx-0 peer-focus:font-medium absolute text-sm text-Information duration-300 transform -translate-y-12 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-secondary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-12 font-semibold">Name<span class="text-xl">*</span></label>
            <span class="invalid_name hidden text-Error font-normal">Este campo es obligatorio</span>
        </div>

        

        
        <div class="relative z-0 w-full mb-5 group col-span-1">
            <input type="text" name="floating_subject" id="floating_subject" class="block font-semibold py-2.5 px-4 w-full text-sm text-Information bg-transparent border-1 border-Information rounded-md appearance-none focus:outline-none focus:ring-2 focus:ring-secondary peer" placeholder=" " required />
            <label for="floating_subject" class="mx-4 peer-focus:mx-0 peer-focus:font-medium absolute text-sm text-Information duration-300 transform -translate-y-12 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-secondary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-12 font-semibold">Subject<span class="text-xl">*</span></label>
            <span class="invalid_subject hidden text-Error font-normal">Este campo es obligatorio</span>
        </div>
        <div class="relative z-0 w-full mb-5 group col-span-1">
            <input type="tel" name="floating_tel" id="floating_tel" class="block font-semibold py-2.5 px-4 w-full text-sm text-Information bg-transparent border-1 border-Information rounded-md appearance-none focus:outline-none focus:ring-2 focus:ring-secondary peer" placeholder=" " />
            <label for="floating_tel" class="mx-4 peer-focus:mx-0 peer-focus:font-medium absolute text-sm text-Information duration-300 transform -translate-y-12 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-secondary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-12 font-semibold">Phone</label>
        </div>
        <div class="relative z-0 w-full mb-5 group col-span-1">
            <input type="email" name="floating_email" id="floating_email" class="block font-semibold py-2.5 px-4 w-full text-sm text-Information bg-transparent border-1 border-Information rounded-md appearance-none focus:outline-none focus:ring-2 focus:ring-secondary peer" placeholder=" " required />
            <label for="floating_email" class="mx-4 peer-focus:mx-0 peer-focus:font-medium absolute text-sm text-Information duration-300 transform -translate-y-12 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-secondary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-12 font-semibold">Email<span class="text-xl">*</span></label>
            <span class="invalid_email hidden text-Error font-normal">Este campo es obligatorio</span>
        </div>
        <div class="relative z-0 w-full mb-5 group col-span-1 md:col-span-2 2xl:col-span-4">
            <textarea name="floating_message" id="floating_message" class="block font-semibold py-2.5 px-4 w-full text-sm text-Information bg-transparent border-1 border-Information rounded-md appearance-none focus:outline-none focus:ring-2 focus:ring-secondary peer" placeholder=" " required></textarea>
            <label for="floating_message" class="mx-4 peer-focus:mx-0 peer-focus:font-medium absolute text-sm text-Information duration-300 transform -translate-y-12 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-secondary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-12 font-semibold">Message<span class="text-xl">*</span></label>
            <span class="invalid_message hidden text-Error font-normal">Este campo es obligatorio</span>
        </div>

        <button type="submit" class="text-white bg-secondary box-border border border-transparent hover:bg-Primary-DarkSoft focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none rounded-md">Submit</button>
    </form>

    
    
</section>
